name: Daily Samsung Fire Overseas News Card

on:
  schedule:
    # UTC 23:00 = KST 08:00 (다음날)
    - cron: "30 16 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼 (테스트용)

concurrency:
  group: daily-news
  cancel-in-progress: true
  
jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily news pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py

      - name: Upload output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardnews-${{ github.run_id }}
          path: |
            output/html/*.html
            output/pptx/*.pptx
            logs/*.log
          retention-days: 30

      - name: Commit updated seen_urls.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/seen_urls.json
          git diff --staged --quiet || git commit -m "chore: update seen_urls.json [skip ci]"
          git pull --rebase origin main || true
          git push
